# Production stack. The deploy job copies this file to the server as ~/ri-hack-2026/docker-compose.yml.
# The server's .env (see .env.example next to this file) holds the secrets. IMAGE_TAG is set by the deploy job.
name: ri-hack-2026-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No published port: only the api container can reach the database.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/fmikan/ri-hack-2026/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Auth__JwtSigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Readiness (includes the database), so `docker compose up --wait` fails the deploy if the API can't serve.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    image: ghcr.io/fmikan/ri-hack-2026/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Localhost only: the server's existing web server (nginx/Apache/Caddy) proxies a domain here and does HTTPS.
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
